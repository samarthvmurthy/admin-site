<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Control Panel</title>
<link rel="icon" type="image/svg+xml" href="assets/icon.svg">
<script src="js/theme.js"></script>
<link rel="stylesheet" href="styles.css">
</head>
<body data-module="dashboard">
<div class="shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <div class="content">
        <header class="topbar">
            <button class="menu-toggle" id="menu-toggle" aria-label="Open menu"></button>
            <div class="topbar-title">
                <h1 id="greeting">Dashboard</h1>
                <p id="today-line"></p>
            </div>
            <div class="topbar-actions"></div>
        </header>

        <main>
            <div class="dash-grid">
                <section class="tile tile-upnext span-2" id="tile-upnext">
                    <div class="tile-head">
                        <span class="tile-icon" data-icon="upnext"></span>
                        <div>
                            <a class="tile-title" href="pages/upnext.html">Up next</a>
                            <div class="tile-sub" id="upnext-sub">Loading…</div>
                        </div>
                        <a class="tile-open" href="pages/upnext.html">Open</a>
                    </div>
                    <div class="tile-body" id="upnext-body"></div>
                </section>

                <section class="tile tile-calendar" id="tile-calendar">
                    <div class="tile-head">
                        <span class="tile-icon" data-icon="calendar"></span>
                        <div>
                            <a class="tile-title" href="pages/calendar.html">Calendar</a>
                            <div class="tile-sub" id="calendar-sub">Loading…</div>
                        </div>
                        <a class="tile-open" href="pages/calendar.html">Open</a>
                    </div>
                    <div class="tile-body" id="calendar-body"></div>
                </section>

                <section class="tile tile-plan" id="tile-plan">
                    <div class="tile-head">
                        <span class="tile-icon" data-icon="plan"></span>
                        <div>
                            <a class="tile-title" href="pages/plan.html">Plan</a>
                            <div class="tile-sub">Tasks &amp; roadmaps</div>
                        </div>
                        <a class="tile-open" href="pages/plan.html">Open</a>
                    </div>
                    <div class="tile-body" id="plan-body"></div>
                </section>

                <section class="tile tile-projects" id="tile-projects">
                    <div class="tile-head">
                        <span class="tile-icon" data-icon="projects"></span>
                        <div>
                            <a class="tile-title" href="pages/projects.html">Projects</a>
                            <div class="tile-sub">GitHub &amp; your own</div>
                        </div>
                        <a class="tile-open" href="pages/projects.html">Open</a>
                    </div>
                    <div class="tile-body" id="projects-body"></div>
                </section>

                <section class="tile tile-jobs" id="tile-jobs">
                    <div class="tile-head">
                        <span class="tile-icon" data-icon="jobs"></span>
                        <div>
                            <a class="tile-title" href="pages/jobs.html">Jobs</a>
                            <div class="tile-sub">Applications &amp; pipeline</div>
                        </div>
                        <a class="tile-open" href="pages/jobs.html">Open</a>
                    </div>
                    <div class="tile-body">
                        <div class="coming-soon">
                            <strong>Integration coming soon</strong>
                            This will connect to your job-tracking project once it's wired in.
                        </div>
                    </div>
                </section>

                <section class="tile tile-habits span-3" id="habits">
                    <div class="tile-head">
                        <span class="tile-icon" data-icon="habits"></span>
                        <div>
                            <div class="tile-title">Habit tracker</div>
                            <div class="tile-sub" id="habits-sub">Tick off each day you show up.</div>
                        </div>
                        <div class="segmented habit-range" id="habit-range" role="group" aria-label="Days shown"></div>
                    </div>
                    <div class="tile-body" id="habits-body"></div>
                </section>
            </div>
        </main>
    </div>
</div>

<input type="file" id="restore-file" accept="application/json,.json" hidden>
<div class="modal-backdrop" id="modal-backdrop"></div>

<script src="js/nav.js"></script>
<script src="js/common.js"></script>
<script src="js/modal.js"></script>
<script src="js/store.js"></script>
<script src="js/items.js"></script>
<script src="js/habits.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
