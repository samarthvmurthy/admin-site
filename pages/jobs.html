<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jobs — Control Panel</title>
<link rel="icon" type="image/svg+xml" href="../assets/icon.svg">
<script src="../js/theme.js?v=66e066f5b5"></script>
<link rel="stylesheet" href="../styles.css?v=c99b4d1b71">
</head>
<body data-module="jobs">
<div class="shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <div class="content">
        <header class="topbar">
            <button class="menu-toggle" id="menu-toggle" aria-label="Open menu"></button>
            <div class="topbar-title">
                <h1>Jobs</h1>
                <p id="runner-status" class="runner-status">Connecting…</p>
            </div>
            <div class="topbar-actions" id="topbar-actions"></div>
        </header>

        <main>
            <div id="jobs-banners"></div>
            <div id="jobs-view"></div>
        </main>
    </div>
</div>

<div class="modal-backdrop" id="modal-backdrop"></div>

<!-- Reports are Markdown that quotes job descriptions from the web, so they
     are rendered with marked and sanitised with DOMPurify before display. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"
        integrity="sha384-/TQbtLCAerC3jgaim+N78RZSDYV7ryeoBCVqTuzRrFec2akfBkHS7ACQ3PQhvMVi"
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"
        integrity="sha384-+VfUPEb0PdtChMwmBcBmykRMDd+v6D/oFmB3rZM/puCMDYcIvF968OimRh4KQY9a"
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="../js/nav.js?v=06f1fcd9e0"></script>
<script src="../js/common.js?v=cc882583f0"></script>
<script src="../js/modal.js?v=39fa28c46d"></script>
<script src="../js/jobs.js?v=51e3ca6ebc"></script>
</body>
</html>
