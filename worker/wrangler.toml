name = "admin-site-api"
main = "src/index.js"
compatibility_date = "2024-01-01"

# Never enable the workers.dev subdomain for this worker — it must only be
# reachable via the Access-protected route below, not a public dev URL.
workers_dev = false

routes = [
  { pattern = "admin.samarthvmurthy.dev/api/*", zone_name = "samarthvmurthy.dev" }
]

[vars]
GITHUB_OWNER = "samarthvmurthy"
GITHUB_REPO = "portfolio"
GITHUB_FILE_PATH = "data.json"

# Project workspaces (next steps, notes, design thinking, custom projects).
# Create the namespace once, then paste its id here:
#   npx wrangler kv namespace create WORKSPACE
[[kv_namespaces]]
binding = "WORKSPACE"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Secrets — set each one with `npx wrangler secret put <NAME>`:
#   GITHUB_TOKEN           repo-scoped personal access token
#   GOOGLE_CLIENT_ID       OAuth client id      (see scripts/google-auth.mjs)
#   GOOGLE_CLIENT_SECRET   OAuth client secret  (see scripts/google-auth.mjs)
#   GOOGLE_REFRESH_TOKEN   printed by `node scripts/google-auth.mjs`
